<style>
:root {
  --color-bg: #EDF2F6;
  --color-surface: #E3ECF2;
  --color-text: #273847;
  --color-accent: #2D719D;
  --color-accent-700: #003E58;
  --color-accent-600: #2D719D;
  --color-accent-100: #EAF1F6;
  --color-accent-800: #273847;
  --color-accent-900: #273847;
  --color-neutral-100: #F3F7FA;
  --color-neutral-200: #DCE5EB;
  --color-neutral-700: #566B7C;
  --color-divider: color-mix(in srgb, #273847 16%, transparent);
  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px; --space-4: 13.6px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-heading); font-weight: 600; line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: 600; font-size: 14px; color: var(--color-text);
  background: transparent; border: 1px solid var(--color-divider); padding: 8px 13px; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
.btn-primary:hover:not(:disabled) { background: var(--color-accent-600); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-ghost { border-color: transparent; color: var(--color-accent); padding-inline: 4px; }
.input { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; background: var(--color-surface);
  border: 1px solid var(--color-divider); color: var(--color-text); }
.corner { position: absolute; width: 8px; height: 8px; border-color: var(--color-accent); border-style: solid; }
.blueprint { position: relative; border: 1px solid var(--color-divider); }
.blueprint .tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.blueprint .tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
.blueprint .bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
.blueprint .br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-family: var(--font-heading); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 11px 10px; border-bottom: 1px solid var(--color-divider); }
.table td { padding: 12px 10px; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
.cand-row { cursor: pointer; }
.cand-row:hover { background: var(--color-accent-100); }
.seg-opt { font-family: var(--font-heading); font-size: 13.5px; letter-spacing: .04em; padding: 7px 13px; border: 0; border-right: 1px solid var(--color-divider); cursor: pointer; background: transparent; }
.slot { font-family: var(--font-heading); font-size: 15px; padding: 11px 6px; border: 1px solid var(--color-divider); background: transparent; cursor: pointer; }
.slot:hover { border-color: var(--color-accent); }
.dialog-backdrop { position: fixed; inset: 0; background: color-mix(in srgb, #273847 55%, transparent); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
.muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
#gate { position: fixed; inset: 0; background: var(--color-bg); display: flex; align-items: center; justify-content: center; z-index: 50; }
#app { display: none; }
.campana { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 1px solid var(--color-divider); background: transparent; cursor: pointer; color: var(--color-text); }
.campana:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.campana .badge { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; padding: 0 5px; background: #a33a2e; color: #fff; font-family: var(--font-heading); font-size: 12px; line-height: 18px; text-align: center; border-radius: 9px; }
.panel-aviso { position: absolute; top: 46px; right: 0; width: min(440px, 92vw); background: var(--color-bg); border: 1px solid var(--color-divider); box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 30; }
.aviso-item { display: block; width: 100%; text-align: left; padding: 11px 14px; background: transparent; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); cursor: pointer; font: inherit; color: inherit; }
.aviso-item:hover { background: var(--color-accent-100); }
.toast { position: fixed; right: 22px; bottom: 22px; max-width: 340px; background: var(--color-accent-900); color: #fff; padding: 12px 16px; font-size: 14px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.2); cursor: pointer; }
/* ===================== BARRA SUPERIOR ===================== */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 28px; position: sticky; top: 0; z-index: 5;
  background: rgba(255,255,255,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,62,88,.08); box-shadow: 0 4px 20px rgba(0,62,88,.06); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #003E58, #2D719D 55%, #9BAEBC); box-shadow: 0 4px 12px rgba(45,113,157,.35); }
.brand-name { font-family: "Poppins", var(--font-heading); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand-pill { font-family: "Poppins", var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: #2D719D; background: #E3ECF2; padding: 5px 13px; border-radius: 999px; }
.campana { border-radius: 12px; border-color: rgba(0,62,88,.14); }
.panel-aviso { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 14px 40px rgba(0,62,88,.18); }

/* ===================== HOME · VACANTES ===================== */
body.is-home {
  background:
    radial-gradient(circle at 100% 0%, rgba(155,174,188,.55), transparent 38%),
    radial-gradient(circle at 0% 100%, rgba(155,174,188,.35), transparent 34%),
    linear-gradient(160deg, #273847 0%, #003E58 50%, #2D719D 100%);
  min-height: 100vh;
}
body.is-home #view-root { margin: 0 auto; }
.home { font-family: "Poppins", var(--font-body); color: #273847; background: #EDF2F6; border-radius: 28px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,30,44,.35); }
.home h1, .home h2, .home h3 { font-family: "Poppins", var(--font-heading); letter-spacing: -.02em; }
.home .muted { color: #566B7C; }

.home-hero { position: relative; display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 24px; align-items: center;
  padding: 52px 56px 120px; color: #fff; overflow: hidden;
  background:
    radial-gradient(circle at 76% 42%, rgba(155,174,188,.38), transparent 44%),
    linear-gradient(135deg, #003E58 0%, #2D719D 58%, #2D719D 100%); }
.home-wave { position: absolute; left: 0; bottom: -1px; width: 100%; height: 100px; display: block; }
.hero-text { position: relative; z-index: 1; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
.hero-eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #C9D5DE; box-shadow: 0 0 10px #C9D5DE; }
.hero-title { font-size: clamp(36px, 4.6vw, 56px); font-weight: 700; line-height: 1.05; margin: 18px 0 12px; color: #fff; }
.hero-sub { font-size: 16px; line-height: 1.6; max-width: 44ch; margin: 0; color: rgba(255,255,255,.82); }
.hero-feats { display: flex; flex-wrap: wrap; gap: 14px 26px; margin-top: 32px; }
.hero-feat { display: flex; align-items: center; gap: 10px; }
.hero-feat .ic { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); color: #C9D5DE; }
.hero-feat strong { display: block; font-size: 20px; font-weight: 600; line-height: 1.1; }
.hero-feat span { display: block; font-size: 12.5px; color: rgba(255,255,255,.75); line-height: 1.3; }
.hero-feat.alerta .ic { color: #fecaca; background: rgba(239,68,68,.22); border-color: rgba(254,202,202,.35); }

.hero-art { position: relative; height: 340px; display: grid; place-items: center; z-index: 1; }
.ring { position: relative; width: 236px; height: 236px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 50% 35%, #9BAEBC 0%, #2D719D 50%, #003E58 100%);
  box-shadow: 0 0 0 12px rgba(255,255,255,.07), 0 20px 50px rgba(0,30,44,.45); }
.ring::before { content: ""; position: absolute; inset: -16px; border-radius: 50%; border: 3px solid #C9D5DE;
  box-shadow: 0 0 24px #9BAEBC, 0 0 60px rgba(155,174,188,.45), inset 0 0 24px rgba(155,174,188,.4); }
.ring::after { content: ""; position: absolute; inset: -40px; border-radius: 50%; border: 1px dashed rgba(201,213,222,.35); }
.ring-num { font-size: 68px; font-weight: 700; line-height: 1; color: #fff; }
.ring-label { font-size: 13px; color: rgba(255,255,255,.82); margin-top: 6px; max-width: 13ch; line-height: 1.3; }
.orb { position: absolute; border-radius: 50%; display: grid; place-items: center; color: #2D719D;
  background: linear-gradient(145deg, #ffffff, #E3ECF2); box-shadow: 0 10px 24px rgba(0,30,44,.35);
  animation: flotar 6s ease-in-out infinite; }
.orb.azul { color: #fff; background: linear-gradient(145deg, #6FA0C0, #003E58); }
.orb.cian { color: #fff; background: linear-gradient(145deg, #C9D5DE, #2D719D); }
.orb.punto { width: 12px; height: 12px; background: #C9D5DE; box-shadow: 0 0 12px #C9D5DE; }
@keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@media (prefers-reduced-motion: reduce) { .orb { animation: none; } .vac-card { transition: none; } }

.home-body { padding: 4px 56px 52px; }
.section-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.section-head h2 { font-size: 26px; font-weight: 600; margin: 0 0 4px; color: #273847; }
.section-head p { margin: 0; font-size: 14px; }
.vac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px; }
.vac-card { display: flex; flex-direction: column; background: #fff; border-radius: 22px; overflow: hidden;
  border: 1px solid rgba(0,62,88,.06); box-shadow: 0 10px 30px rgba(0,62,88,.08); transition: transform .2s ease, box-shadow .2s ease; }
.vac-card:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(0,62,88,.16); }
.vac-media { position: relative; height: 168px; background: linear-gradient(135deg, #003E58, #2D719D 60%, #9BAEBC); display: grid; place-items: center; color: rgba(255,255,255,.9); }
.vac-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vac-media .blob { position: absolute; right: -30px; top: -30px; width: 130px; height: 130px; border-radius: 50%; background: rgba(155,174,188,.35); }
.vac-tag { position: absolute; top: 12px; left: 12px; font-family: ui-monospace, monospace; font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
  background: rgba(255,255,255,.94); color: #2D719D; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.vac-off { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em;
  padding: 4px 10px; border-radius: 999px; background: #273847; color: #fff; }
.vac-body { display: flex; flex-direction: column; gap: 12px; padding: 20px 22px 22px; flex: 1; }
.vac-body h3 { font-size: 19px; font-weight: 600; line-height: 1.25; margin: 0; color: #273847; }
.vac-salary { font-size: 14px; font-weight: 600; color: #2D719D; margin-top: 4px; }
.vac-req { margin: 0; font-size: 13px; line-height: 1.55; color: #566B7C; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vac-warn { font-size: 12.5px; color: #6d5210; background: #fdf3d8; padding: 6px 11px; border-radius: 10px; }
.vac-stats { display: grid; grid-template-columns: repeat(4, 1fr); background: #E9F0F5; border-radius: 14px; padding: 10px 4px; }
.vac-stats > div { text-align: center; }
.vac-stats .lbl { font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: #566B7C; }
.vac-stats .val { font-size: 22px; font-weight: 600; line-height: 1.2; }
.vac-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.home .btn { border-radius: 999px; font-family: "Poppins", var(--font-body); font-weight: 500; font-size: 14px; padding: 10px 16px; }
.home .btn-primary { background: linear-gradient(90deg, #2D719D, #003E58); border-color: transparent; box-shadow: 0 6px 16px rgba(45,113,157,.3); }
.home .btn-primary:hover:not(:disabled) { background: linear-gradient(90deg, #003E58, #2D719D); }
.home .btn-secondary { background: #fff; border-color: #C9D8E3; color: #2D719D; }
.home .btn-secondary:hover { background: #E9F0F5; }
.vac-vacio { text-align: center; padding: 40px 20px; background: #fff; border-radius: 22px; color: #566B7C; }

@media (max-width: 900px) {
  .home-hero { grid-template-columns: 1fr; padding: 40px 28px 110px; }
  .hero-art { height: 300px; }
  .home-body { padding: 4px 28px 36px; }
}
@media (max-width: 560px) {
  .home { border-radius: 20px; }
  .hero-art { transform: scale(.85); }
  .topbar { padding: 10px 16px; }
  .brand-pill { display: none; }
}

.tag-nuevo { margin-left: 6px; padding: 1px 6px; font-family: var(--font-heading); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--color-accent); color: #fff; }

/* ===================== TEMA PERFIL · dashboard azul (pantallas internas) ===================== */
:root {
  --lila-900: #273847; --lila-700: #003E58; --lila-600: #2D719D; --lila-500: #2D719D; --lila-200: #D3DEE6; --lila-100: #E3ECF2; --lila-50: #F3F7FA;
  --rosa-500: #E3ECF2; --rosa-600: #C9D5DE; --rosa-100: #E9EEF2;
  --verde-500: #35b27b; --verde-100: #ddf3e8; --verde-700: #1e7a52;
  --ambar-500: #e3a02f; --ambar-100: #fbf0d9; --ambar-700: #8a5e0b;
  --rojo-500: #db5a56; --rojo-100: #fbe5e3; --rojo-700: #a5322e;
  --tinta: #273847; --tinta-suave: #566B7C; --sombra: 0 4px 18px rgba(0,62,88,.10);
}
.shell { display: block; }
#main { min-width: 0; }
#sidebar, .topbar-title, .topbar-search { display: none; }

body:not(.is-home) {
  --color-accent: #2D719D; --color-accent-700: #003E58; --color-accent-600: #2D719D; --color-accent-100: #EAF1F6;
  --color-accent-800: #273847; --color-accent-900: #273847; --color-text: #273847; --color-surface: #F3F7FA;
  --color-neutral-200: #DCE5EB; --color-divider: #DCE5EB; --color-bg: #EDF2F6;
  background: #EDF2F6; color: var(--tinta); font-family: "Poppins", var(--font-body); }
body:not(.is-home) h1, body:not(.is-home) h2, body:not(.is-home) h3 { font-family: "Poppins", var(--font-heading); font-weight: 600; letter-spacing: -.01em; color: var(--tinta); }
body:not(.is-home) .muted { color: var(--tinta-suave); }
body:not(.is-home) #view-root { padding: 20px 18px 48px !important; max-width: 1400px !important; }

/* Estructura: menú lateral + contenido */
body:not(.is-home) .shell { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100vh; align-items: start; }
body:not(.is-home) #sidebar { display: flex; flex-direction: column; position: sticky; top: 14px; height: calc(100vh - 28px); margin: 14px 0 14px 14px; padding: 30px 16px 0;
  border-radius: 28px; overflow: hidden; color: #fff; box-shadow: var(--sombra);
  background: linear-gradient(170deg, #2D719D 0%, #003E58 100%); }
.sb-brand small { display: block; font-size: 14px; font-weight: 400; opacity: .92; padding-left: 8px; }
.sb-brand strong { display: block; font-size: 21px; font-weight: 600; line-height: 1.25; margin-top: 6px; padding-left: 8px; }
.sb-logo { display: block; width: 178px; max-width: 100%; height: auto; margin: 0 0 0 6px; }
.sb-sub { display: block; margin: 12px 0 0 10px; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #C9D5DE; }
.brand-logo { display: block; height: 46px; width: auto; }
.sb-nav { display: flex; flex-direction: column; gap: 3px; margin-top: 26px; }
.sb-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; color: #fff; font: inherit; font-size: 13.5px;
  padding: 11px 14px; border-radius: 15px; cursor: pointer; text-align: left; text-decoration: none; }
.sb-item:hover { background: rgba(255,255,255,.13); }
.sb-item.activo { background: #E3ECF2; color: var(--lila-700); font-weight: 500; box-shadow: 0 4px 12px rgba(0,30,44,.18); }
.sb-ico { display: grid; place-items: center; width: 22px; }
.sb-ico svg { width: 19px; height: 19px; }
.sb-count { margin-left: auto; min-width: 23px; height: 23px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center;
  font-size: 11.5px; background: rgba(255,255,255,.2); }
.sb-item.activo .sb-count { background: #fff; color: var(--lila-700); }
.sb-count.alerta { background: var(--ambar-500); color: #273847; }
.sb-art { margin-top: auto; margin-inline: -16px; line-height: 0; }
.sb-art svg { width: 100%; height: auto; display: block; }

/* Barra superior como tarjeta */
body:not(.is-home) .topbar { position: sticky; top: 14px; margin: 14px 14px 0 18px; padding: 12px 22px; border: 0; border-radius: 22px; background: #fff;
  box-shadow: var(--sombra); backdrop-filter: none; }
body:not(.is-home) .topbar .brand { display: none; }
body:not(.is-home) .topbar-title { display: block; margin: 0; font-size: 22px; font-weight: 600; color: var(--tinta); font-family: "Poppins", var(--font-heading); }
body:not(.is-home) .topbar-search { display: flex; align-items: center; gap: 6px; margin-left: auto; background: #EDF2F6; border-radius: 999px; padding: 4px 4px 4px 18px; min-width: 260px; }
.topbar-search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--tinta); outline: none; }
.topbar-search input::placeholder { color: var(--tinta-suave); }
.topbar-search button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--lila-600); color: #fff; display: grid; place-items: center; cursor: pointer; }
body:not(.is-home) .campana { border: 0; border-radius: 50%; color: var(--tinta); background: transparent; }
body:not(.is-home) .campana:hover { background: var(--lila-50); }
body:not(.is-home) .campana .badge { background: var(--rojo-500); border-radius: 999px; font-family: "Poppins", var(--font-body); }
body:not(.is-home) .panel-aviso { border-radius: 18px; border: 0; background: #fff; box-shadow: 0 14px 40px rgba(0,62,88,.2); }

/* Botones, campos y contenedores */
body:not(.is-home) .btn { border-radius: 999px; font-family: "Poppins", var(--font-body); font-weight: 500; font-size: 13.5px; padding: 10px 18px;
  border: 1px solid var(--lila-200); color: var(--lila-700); background: #fff; }
body:not(.is-home) .btn:hover:not(:disabled) { background: var(--lila-50); }
body:not(.is-home) .btn-primary { background: var(--lila-600); color: #fff; border-color: var(--lila-600); box-shadow: 0 6px 14px rgba(45,113,157,.28); }
body:not(.is-home) .btn-primary:hover:not(:disabled) { background: var(--lila-700); }
body:not(.is-home) .btn-ghost { border-color: transparent; background: transparent; padding-inline: 6px; }
body:not(.is-home) .btn-rosa { background: #fff; color: var(--lila-700); border-color: #fff; box-shadow: 0 6px 14px rgba(0,30,44,.30); }
body:not(.is-home) .btn-rosa:hover:not(:disabled) { background: var(--lila-100); }
body:not(.is-home) .btn-peligro { color: var(--rojo-700); border-color: #f0c4c2; background: #fff; }
body:not(.is-home) .btn-peligro:hover:not(:disabled) { background: var(--rojo-100); }
body:not(.is-home) .input { border-radius: 14px; background: var(--lila-50); border: 1px solid var(--lila-200); min-height: 40px; padding: 8px 14px; color: var(--tinta); font-family: "Poppins", var(--font-body); font-size: 13.5px; }
body:not(.is-home) .input:focus { outline: 2px solid var(--lila-500); outline-offset: 1px; }
body:not(.is-home) .blueprint { border: 0; border-radius: 22px; background: #fff; box-shadow: var(--sombra); }
body:not(.is-home) .corner { display: none; }
body:not(.is-home) .dialog-backdrop { background: rgba(39,56,71,.5); backdrop-filter: blur(2px); --color-bg: #fff; }
body:not(.is-home) .dialog-backdrop .blueprint { background: #fff !important; box-shadow: 0 24px 60px rgba(0,30,44,.35); }
body:not(.is-home) .slot { border-radius: 14px; font-family: "Poppins", var(--font-body); font-size: 13.5px; border-color: var(--lila-200); }
body:not(.is-home) .tag-nuevo { border-radius: 999px; background: var(--lila-600); font-family: "Poppins", var(--font-body); padding: 2px 8px; }

.card { position: relative; background: #fff; border-radius: 24px; box-shadow: var(--sombra); padding: 22px 26px; }
.card > h3 { font-size: 16px; margin: 0 0 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; font-family: "Poppins", var(--font-body); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; }
.pill.neutra { background: var(--lila-100); color: var(--lila-700); }
.pill.rojo { background: var(--rojo-100); color: var(--rojo-700); }
.pill.ambar { background: var(--ambar-100); color: var(--ambar-700); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 6px 4px 18px; }
.page-head h1 { font-size: 26px; margin: 0 0 2px; }
.page-head p { margin: 0; font-size: 13px; }
.page-actions { display: flex; gap: 8px; }

/* Tarjetas de resumen */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 18px; }
.kpi { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: var(--sombra); }
.kpi[data-kpi] { cursor: pointer; }
.kpi[data-kpi]:hover { box-shadow: 0 8px 24px rgba(0,62,88,.2); }
.kpi-ico { flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; }
.kpi.lila .kpi-ico { background: var(--lila-100); color: var(--lila-700); }
.kpi.verde .kpi-ico { background: var(--verde-100); color: var(--verde-700); }
.kpi.ambar .kpi-ico { background: var(--ambar-100); color: var(--ambar-700); }
.kpi.rosa .kpi-ico { background: #e9eef2; color: var(--lila-900); }
.kpi.rojo .kpi-ico { background: var(--rojo-100); color: var(--rojo-700); }
.kpi-lbl { font-size: 11.5px; color: var(--tinta-suave); line-height: 1.3; }
.kpi-num { font-size: 26px; font-weight: 600; line-height: 1.15; color: var(--tinta); }

/* Filtros y tabla */
.filtros { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 18px; padding: 18px 22px; }
.f-campo label { display: block; margin-bottom: 5px; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-suave); }
.f-grande { flex: 1 1 230px; }
.seg { display: flex; background: var(--lila-50); border: 1px solid var(--lila-200); border-radius: 999px; padding: 3px; }
.seg-opt { border: 0; background: transparent; color: var(--tinta); font-family: "Poppins", var(--font-body); font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg-opt.on { background: var(--lila-600); color: #fff; box-shadow: 0 3px 8px rgba(45,113,157,.3); }
.tabla { padding: 10px 14px 6px; }
body:not(.is-home) .table { border-collapse: separate; border-spacing: 0 5px; }
body:not(.is-home) .table th { font-family: "Poppins", var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: .08em; color: var(--tinta-suave); border-bottom: 0; padding: 6px 12px; }
body:not(.is-home) .table td { padding: 12px; border-bottom: 0; }
body:not(.is-home) .cand-row td:first-child { border-radius: 16px 0 0 16px; }
body:not(.is-home) .cand-row td:last-child { border-radius: 0 16px 16px 0; }
body:not(.is-home) .cand-row:hover td { background: var(--lila-50); }
.folio { font-family: ui-monospace, monospace; font-size: 12px; color: var(--tinta-suave); white-space: nowrap; }
.persona { display: flex; align-items: center; gap: 11px; font-weight: 500; }
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--lila-700);
  background: linear-gradient(145deg, #F3F7FA, #D3DEE6); }
.barra { flex: 1; height: 7px; border-radius: 999px; background: var(--lila-100); overflow: hidden; }
.barra i { display: block; height: 100%; border-radius: 999px; }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 6px 0; }

/* Perfil del candidato */
.perfil { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 32px; align-items: center; margin: 16px 0 18px; padding: 26px 30px; }
.avatar { position: relative; width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 35% 28%, #fff 0, #E3ECF2 48%, #B5C5D1 100%); box-shadow: inset 0 0 0 6px rgba(255,255,255,.6), 0 10px 26px rgba(45,113,157,.28); }
.avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.avatar span { position: relative; font-size: 50px; font-weight: 600; color: var(--lila-700); letter-spacing: .02em; }
.perfil-cab { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.perfil-cab h1 { font-size: 30px; margin: 2px 0 0; }
.etiquetas { display: flex; flex-wrap: wrap; gap: 8px; }
.datos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 30px; }
.datos li { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dato-ico { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--lila-100); color: var(--lila-600); }
.dato-lbl { display: block; font-size: 11px; color: var(--tinta-suave); line-height: 1.2; }
.dato-val { display: block; font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; }
.perfil-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-bottom: 18px; }
.col-lado { display: flex; flex-direction: column; gap: 18px; }
.leyenda { font-size: 12.5px; margin: 0 0 16px; }
.linea { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 34px; }
.linea::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 24px; width: 3px; border-radius: 3px; background: var(--lila-200); }
.paso { position: relative; display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 18px; background: var(--lila-50); }
.paso::before { content: ""; position: absolute; left: -33px; top: 50%; width: 15px; height: 15px; margin-top: -7px; border-radius: 50%; background: var(--lila-600); box-shadow: 0 0 0 4px #fff, 0 0 0 5px var(--lila-200); }
.paso.parcial { background: #fdf6e8; } .paso.parcial::before { background: var(--ambar-500); }
.paso.no { background: #fdf0f0; } .paso.no::before { background: var(--rojo-500); }
.paso.cumple::before { background: var(--verde-500); }
.paso-ico { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 600; }
.paso-txt { flex: 1; min-width: 0; }

<body>

<!-- ===================== PANTALLA DE CONTRASEÑA ===================== -->
<div id="gate">

    <input id="gate-input" class="input" type="password" placeholder="Contraseña" style="margin-bottom:12px">

<!-- ===================== APP ===================== -->
<div id="app">
<div class="shell">
  <aside id="sidebar" aria-label="Menú del panel"></aside>
  <div id="main">
  <div class="topbar">
    <div class="brand">
      <img class="brand-logo" id="brand-logo" alt="DRFC Ingeniería S.A. de C.V.">
      <span class="brand-pill">Reclutamiento IA</span>
    </div>
    <h2 id="topbar-title" class="topbar-title"></h2>
    <div class="topbar-search" role="search">
      <input id="buscar-global" type="search" placeholder="Buscar candidato o folio" aria-label="Buscar candidato o folio" autocomplete="off">
      <button id="btn-buscar-global" type="button" aria-label="Buscar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:18px">
      <div id="header-status" class="muted" style="font-size:12.5px">Cargando…</div>
      <div style="position:relative">
        <button id="btn-campana" class="campana" aria-label="Candidatos nuevos" title="Candidatos nuevos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span id="campana-badge" class="badge" style="display:none">0</span>
        </button>

  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
/* ===================== ESTADO ===================== */
const state = {
  vista: "vacantes",
  seleccion: null,
  busqueda: "",
  vacante: "todas",
  rec: "todas",
  ordenPor: "score",
  ordenDesc: true,
  pagina: 1,
  porPagina: 25,
  fechaPreset: "todo",
  desde: "",
  hasta: "",
  vistos: null,
  maxIdConocido: null,
  ultimoRefrescoCompleto: 0,
  cvCache: {},
  vacanteSel: null,
  vacantesDetalle: {},
  detalleVacErr: null,
  guardandoVac: false,
  resultadoAgenda: null,
  agendadasLocal: {},
  estadoFiltro: "activos",
  descartar: null,
  descartando: false,
  descartadosLocal: {},
  conocidos: null,
  campanaAbierta: false,
  refrescando: false,
  ultimaActualizacion: null,
  timer: null,
  agenda: null,
  fecha: hoyLocal(),
  hora: "",
  confirmando: false,
  vacantes: [],
  evaluaciones: [],
  loading: true,
  error: null
};

const REC = {
  avanzar:   { texto: "Avanzar",             color: "#2f6b46", bg: "#e4efe7", ink: "#20492f" },
  revisar:   { texto: "Revisar manualmente", color: "#b5891a", bg: "#f6efdc", ink: "#6d5210" },
  descartar: { texto: "Descartar",           color: "#a33a2e", bg: "#f4e3e0", ink: "#7a2b21" }
};
function recKey(recomendacion) {
  const r = (recomendacion || "").toLowerCase();
  if (r.includes("avanzar")) return "avanzar";
  if (r.includes("descartar")) return "descartar";
  return "revisar";
}

const HORAS = ["11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM", "1:00 PM"];
const FILTROS = [
  { key: "todas", label: "Todas" },
  { key: "avanzar", label: "Avanzar" },
  { key: "revisar", label: "Revisar" }
];

/* ===================== SUPABASE ===================== */
const supa = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* ===================== FECHAS Y AVISOS ===================== */
// La base guarda creado_en en hora UTC sin zona; se interpreta como UTC y se muestra en la hora del navegador.
function leerFecha(s) {
  if (!s) return null;
  let t = String(s).replace(" ", "T");
  if (!/[zZ]|[+-]\d\d(:?\d\d)?$/.test(t)) t += "Z";
  const d = new Date(t);
  return isNaN(d.getTime()) ? null : d;
}
const CLAVE_VISTOS = "drfc_candidatos_vistos";
function leerVistos() { try { const v = JSON.parse(localStorage.getItem(CLAVE_VISTOS)); return Array.isArray(v) ? new Set(v) : null; } catch (e) { return null; } }
function guardarVistos() { try { localStorage.setItem(CLAVE_VISTOS, JSON.stringify([...state.vistos])); } catch (e) {} }
function marcarVisto(folio) {
  if (state.vistos && !state.vistos.has(folio)) { state.vistos.add(folio); guardarVistos(); actualizarCampana(); }
}
// Una solicitud está "pendiente" si no se ha tomado ninguna decisión (agendar o descartar) y ya pasaron los días del recordatorio.
function diasSinRevisar(c) {
  if (c.descartado || c.estado !== "Sin agendar" || !c.ts) return null;
  return Math.floor((Date.now() - c.ts) / 86400000);
}
function esPendiente(c) {
  const d = diasSinRevisar(c);
  return d !== null && d >= (CONFIG.DIAS_RECORDATORIO || 5);
}
function pendientesCandidatos() {
  return state.evaluaciones.filter(esPendiente).sort((a, b) => a.ts - b.ts);   // los más antiguos primero
}
function avisosTotales() {
  const nuevos = nuevosCandidatos();
  const idsNuevos = new Set(nuevos.map(c => c.folio));
  return { nuevos, pendientes: pendientesCandidatos().filter(c => !idsNuevos.has(c.folio)) };
}
function nuevosCandidatos() {
  return state.evaluaciones.filter(c => !c.descartado && !state.vistos.has(c.folio)).sort((a, b) => b.ts - a.ts);
}
function hace(ts) {
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return "ahora mismo";
  if (m < 60) return `hace ${m} min`;
  const hrs = Math.round(m / 60);
  if (hrs < 24) return `hace ${hrs} h`;
  const dias = Math.round(hrs / 24);
  return dias === 1 ? "ayer" : `hace ${dias} días`;
}
function actualizarEncabezado() {
  const hora = state.ultimaActualizacion ? state.ultimaActualizacion.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit", hour12: true }) : "";
  document.getElementById("header-status").textContent = state.loading
    ? "Cargando…"
    : state.error
      ? "Error: " + state.error
      : `Sincronizado · ${state.evaluaciones.length} ${state.evaluaciones.length === 1 ? "candidato" : "candidatos"}${hora ? " · actualizado " + hora : ""}`;
  actualizarShell();
}
function actualizarCampana() {
  if (!state.vistos) return;
  const { nuevos, pendientes } = avisosTotales();
  const n = nuevos.length + pendientes.length;
  const badge = document.getElementById("campana-badge");
  badge.style.display = n ? "block" : "none";
  badge.textContent = n > 99 ? "99+" : String(n);
  document.title = (n ? `(${n}) ` : "") + "DRFC · Panel de Candidatos";
  if (state.campanaAbierta) pintarPanelAviso();
}
function pintarPanelAviso() {
  const { nuevos, pendientes } = avisosTotales();
  const cont = document.getElementById("panel-aviso");
  const item = (c, cuando) => `<button class="aviso-item" data-folio="${c.folio}">
      <div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(c.nombre)}</strong><span class="muted" style="font-size:12px;white-space:nowrap">${cuando}</span></div>
      <div class="muted" style="font-size:13px">${esc(c.vacante)}${c.sinCv ? " · Sin CV" : ""}</div>
      <div style="font-size:13px;margin-top:2px">Score ${c.score} · ${REC[c.rec].texto}</div></button>`;
  const seccion = (titulo, lista, cuando) => lista.length ? `
      <div class="muted" style="padding:9px 14px 5px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em">${titulo} (${lista.length})</div>
      ${lista.slice(0, 6).map(c => item(c, cuando(c))).join("")}${lista.length > 6 ? `<div class="muted" style="padding:8px 14px;font-size:12.5px">y ${lista.length - 6} más…</div>` : ""}` : "";
  const dias = CONFIG.DIAS_RECORDATORIO || 5;
  cont.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--color-divider)">
      <strong style="font-family:var(--font-heading);font-size:16px;white-space:nowrap">Avisos</strong>
      ${nuevos.length ? `<button class="btn btn-ghost" id="btn-marcar-vistos" style="font-size:13px">Marcar nuevos como vistos</button>` : ""}</div>
    ${seccion("Candidatos nuevos", nuevos, c => hace(c.ts))}
    ${seccion(`Pendientes de revisar · más de ${dias} días`, pendientes, c => `hace ${diasSinRevisar(c)} días`)}
    ${(!nuevos.length && !pendientes.length) ? `<div class="muted" style="padding:16px 14px;font-size:13.5px">No hay avisos.</div>` : ""}`;
  cont.querySelectorAll(".aviso-item").forEach(el => el.onclick = () => { cerrarCampana(); abrir(Number(el.dataset.folio)); });
  const todos = document.getElementById("btn-marcar-vistos");
  if (todos) todos.onclick = () => { nuevosCandidatos().forEach(c => state.vistos.add(c.folio)); guardarVistos(); actualizarCampana(); if (!["detalle", "vacante"].includes(state.vista)) render(); };
}
function cerrarCampana() { state.campanaAbierta = false; document.getElementById("panel-aviso").style.display = "none"; }
function alternarCampana() {
  state.campanaAbierta = !state.campanaAbierta;
  const cont = document.getElementById("panel-aviso");
  cont.style.display = state.campanaAbierta ? "block" : "none";
  if (state.campanaAbierta && state.vistos) pintarPanelAviso();
}
let temporizadorToast = null;
function mostrarToast(texto, folio) {
  const t = document.getElementById("toast");
  t.textContent = texto; t.style.display = "block";
  t.onclick = () => { t.style.display = "none"; abrir(folio); };
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => { t.style.display = "none"; }, 9000);
}
function procesarNuevos() {
  if (state.vistos === null) {
    state.vistos = leerVistos();
    if (state.vistos === null) { state.vistos = new Set(state.evaluaciones.map(c => c.folio)); guardarVistos(); } // primera vez: nada se marca como nuevo
  }
  if (state.conocidos !== null) {
    const llegaron = state.evaluaciones.filter(c => !state.conocidos.has(c.folio)).sort((a, b) => b.ts - a.ts);
    if (llegaron.length === 1) mostrarToast(`Nuevo candidato: ${llegaron[0].nombre} · ${llegaron[0].vacante}`, llegaron[0].folio);
    else if (llegaron.length > 1) mostrarToast(`${llegaron.length} candidatos nuevos`, llegaron[0].folio);
  }
  state.conocidos = new Set(state.evaluaciones.map(c => c.folio));
  actualizarCampana();
}
function iniciarActualizacionAutomatica() {
  if (state.timer) return;
  state.timer = setInterval(revisarCambios, (CONFIG.ACTUALIZAR_CADA_SEGUNDOS || 30) * 1000);
}
// Revisión ligera: pregunta solo por el folio más reciente (unos pocos bytes). Descarga todo únicamente si llegó
// alguien nuevo, o cada REFRESCO_COMPLETO_MINUTOS mientras el panel está visible.
async function revisarCambios() {
  if (state.refrescando) return;
  try {
    const { data, error } = await supa.from("evaluaciones").select("id").order("id", { ascending: false }).limit(1);
    if (error) return;
    const maxId = data && data.length ? data[0].id : 0;
    const pasoElTiempo = Date.now() - state.ultimoRefrescoCompleto > (CONFIG.REFRESCO_COMPLETO_MINUTOS || 10) * 60000;
    if (maxId !== state.maxIdConocido || (pasoElTiempo && document.visibilityState === "visible")) await cargarDatos({ silencioso: true });
  } catch (e) { /* una falla de red no tira el panel */ }
}
// Columnas de las evaluaciones SIN el CV (cv_base64 pesa cientos de KB por candidato y solo se baja al pedir "Ver CV")
const COLS_EVAL_BASE = "id, telefono, vacante_id, cv_url, score, resumen, fortalezas, riesgos, recomendacion, creado_en, nombre";
async function leerEvaluaciones() {
  const consulta = (cols) => supa.from("evaluaciones").select(cols).order("creado_en", { ascending: false }).limit(1000);
  state.sinColDesglose = false;
  let r = await consulta(COLS_EVAL_BASE + ", desglose, descartado_en");
  // Si falta alguna columna nueva se prueba sin ella, para no perder el desglose cuando solo falta la de descartar.
  if (r.error && r.error.code === "42703") r = await consulta(COLS_EVAL_BASE + ", desglose");
  if (r.error && r.error.code === "42703") { state.sinColDesglose = true; r = await consulta(COLS_EVAL_BASE); }
  return r;
}

async function cargarDatos(opciones = {}) {
  const silencioso = !!opciones.silencioso;
  if (silencioso && state.refrescando) return;
  state.refrescando = true;
  if (!silencioso) { state.loading = true; state.error = null; render(); }
  try {
    const [{ data: vacantesData, error: e1 }, { data: evalData, error: e2 },
           { data: convData, error: e3 }, { data: entData, error: e4 }] = await Promise.all([
      supa.from("vacantes").select("*").order("id"),
      leerEvaluaciones(),
      supa.from("conversaciones").select("telefono, edad, tiene_rfc"),
      supa.from("entrevistas_notificadas").select("folio, fecha_hora_notificada, notificado_en").order("notificado_en", { ascending: false })
    ]);
    if (e1) throw e1; if (e2) throw e2; if (e3) throw e3; if (e4) throw e4;

    const vacantesById = Object.fromEntries((vacantesData || []).map(v => [v.id, v]));
    const convByTel = Object.fromEntries((convData || []).map(c => [c.telefono, c]));
    const entByFolio = {};
    for (const row of (entData || [])) {
      if (!entByFolio[row.folio]) entByFolio[row.folio] = row; // ya viene ordenado por notificado_en desc
    }

    state.vacantes = vacantesData || [];
    state.evaluaciones = (evalData || []).map(e => {
      const conv = convByTel[e.telefono] || {};
      const ent = entByFolio[e.id];
      let estado = "Sin agendar";
      if (ent && ent.fecha_hora_notificada) {
        const fh = new Date(ent.fecha_hora_notificada);
        const legible = fh.toLocaleString("es-MX", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });
        estado = (fh.getTime() < Date.now() ? "Realizada · " : "Agendada · ") + legible;
      }
      if (estado === "Sin agendar" && state.agendadasLocal[e.id]) estado = state.agendadasLocal[e.id];
      return {
        folio: e.id,
        nombre: e.nombre || "(sin nombre)",
        telefono: e.telefono,
        vacanteId: e.vacante_id,
        vacante: vacantesById[e.vacante_id] ? vacantesById[e.vacante_id].titulo : "(vacante desconocida)",
        score: e.score ?? 0,
        rec: recKey(e.recomendacion),
        ts: leerFecha(e.creado_en) ? leerFecha(e.creado_en).getTime() : 0,
        fecha: leerFecha(e.creado_en) ? leerFecha(e.creado_en).toLocaleString("es-MX", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }) : "",
        estado,
        edad: conv.edad ?? "—",
        rfc: conv.tiene_rfc === true ? "Sí" : conv.tiene_rfc === false ? "No" : "—",
        tieneCv: !!e.cv_url && e.cv_url !== "sin_cv",
        sinCv: e.cv_url === "sin_cv",
        descartado: !!e.descartado_en || !!state.descartadosLocal[e.id],
        descartadoEn: leerFecha(e.descartado_en) ? leerFecha(e.descartado_en).getTime() : (state.descartadosLocal[e.id] || 0),
        desglose: leerDesglose(e.desglose),
        resumen: e.resumen || "",
        fortalezas: Array.isArray(e.fortalezas) ? e.fortalezas : [],
        riesgos: Array.isArray(e.riesgos) ? e.riesgos : []
      };
    });
    try {
      const { data: det, error: eDet } = await supa.rpc("panel_vacantes_completas", { p_clave: CONFIG.WEBHOOK_CLAVE });
      if (eDet) throw eDet;
      if (!det || det.ok !== true) throw new Error((det && det.error) || "Respuesta no válida.");
      state.vacantesDetalle = Object.fromEntries(det.vacantes.map(v => [v.id, v]));
      state.detalleVacErr = null;
    } catch (errDet) {
      state.detalleVacErr = errDet.code === "PGRST202" ? "Faltan las funciones de vacantes en Supabase. Corre el SQL de vacantes." : (errDet.message || String(errDet));
    }
    procesarNuevos();
  } catch (err) {
    console.error(err);
    if (!silencioso) state.error = err.message || String(err);
    else { state.refrescando = false; return; }   // una falla de red en el refresco automático no tira el panel
  }
  state.refrescando = false;
  state.loading = false;
  state.ultimaActualizacion = new Date();
  state.ultimoRefrescoCompleto = Date.now();
  state.maxIdConocido = state.evaluaciones.reduce((m, c) => Math.max(m, c.folio), 0);
  if (!silencioso) { render(); return; }
  // Refresco automático: solo se redibuja si no se está escribiendo ni hay un cuadro abierto
  const a = document.activeElement;
  const escribiendo = a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName);
  if (!["detalle", "vacante"].includes(state.vista) && !escribiendo && !state.campanaAbierta) render(); else actualizarEncabezado();
}

/* ===================== ACCIONES ===================== */
function abrir(folio) { marcarVisto(folio); state.vista = "detalle"; state.seleccion = folio; render(); }

async function verCV(folio) {
  const c = state.evaluaciones.find(x => x.folio === folio);
  if (!c || !c.tieneCv) { alert("Este candidato no tiene un CV almacenado."); return; }
  const ventana = window.open("", "_blank");            // se abre ya, para que el navegador no la bloquee
  const cerrarVentana = () => { if (ventana) ventana.close(); };
  let b64 = state.cvCache[folio];
  if (!b64) {
    const { data, error } = await supa.from("evaluaciones").select("cv_base64").eq("id", folio).limit(1);
    if (error) { cerrarVentana(); alert("No se pudo descargar el CV: " + (error.message || "error de conexión")); return; }
    b64 = data && data[0] ? data[0].cv_base64 : null;
    if (!b64) { cerrarVentana(); alert("Este candidato no tiene un CV almacenado."); return; }
    state.cvCache[folio] = b64;
  }
  let url;
  try {
    const byteChars = atob(b64);
    const bytes = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
    url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  } catch (e) { cerrarVentana(); alert("El CV guardado está dañado y no se puede abrir."); return; }
  if (ventana) ventana.location.href = url;
  else { const a = document.createElement("a"); a.href = url; a.download = "CV-" + folio + ".pdf"; a.click(); }
}

function hoyLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function confirmarAgenda() {
  if (!state.hora || !state.fecha || !state.seleccion || state.confirmando) return;
  if (!CONFIG.WEBHOOK_AGENDAR_URL || CONFIG.WEBHOOK_AGENDAR_URL.startsWith("PEGA_AQUI")) {
    alert("Falta configurar la URL del flujo de n8n (WEBHOOK_AGENDAR_URL) en el código del archivo.");
    return;
  }
  state.confirmando = true; render();
  try {
    let resp;
    try {
      resp = await fetch(CONFIG.WEBHOOK_AGENDAR_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ folio: state.seleccion, fecha: state.fecha, hora: state.hora, clave: CONFIG.WEBHOOK_CLAVE })
      });
    } catch (e) {
      throw new Error("No se pudo conectar con n8n. Revisa tu conexión a internet.");
    }
    let datos = null;
    try { datos = await resp.json(); } catch (e) {}
    if (!resp.ok || !datos || datos.ok !== true) {
      if (datos && datos.error) throw new Error(datos.error);
      if (resp.status === 404) throw new Error('No se encontró el flujo en n8n. Revisa que "Agendar Entrevista desde el Panel" esté publicado.');
      throw new Error("n8n respondió con error " + resp.status + ".");
    }
    state.resultadoAgenda = datos;
    state.agendadasLocal[state.seleccion] = "Agendada · " + fechaLegibleAgenda() + (datos.aviso_enviado ? "" : " (aviso pendiente)");
    const c = state.evaluaciones.find(x => x.folio === state.seleccion);
    if (c) c.estado = state.agendadasLocal[state.seleccion];
    state.agenda = "confirmada";
  } catch (err) {
    alert("No se pudo agendar la entrevista: " + err.message);
  }
  state.confirmando = false;
  render();
}

function exportarCSV() {
  const filas = filasFiltradas();
  const encabezado = ["Folio","Nombre","Vacante","Score","Recomendacion","SinCV","Descartado","Evaluado","Estado"];
  const lineas = [encabezado.join(",")].concat(filas.map(c =>
    [c.folio, `"${c.nombre}"`, `"${c.vacante}"`, c.score, REC[c.rec].texto, c.sinCv ? "Sí" : "No", c.descartado ? "Sí" : "No", `"${c.fecha}"`, `"${c.estado}"`].join(",")
  ));
  const blob = new Blob([lineas.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "candidatos_drfc.csv";
  a.click();
}

/* ===================== DERIVADOS ===================== */
function dentroDeFecha(c) {
  const p = state.fechaPreset;
  if (p === "todo") return true;
  const ahora = new Date();
  const inicioHoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()).getTime();
  const DIA = 86400000;
  if (p === "hoy") return c.ts >= inicioHoy;
  if (p === "7") return c.ts >= inicioHoy - 6 * DIA;
  if (p === "30") return c.ts >= inicioHoy - 29 * DIA;
  if (p === "rango") {
    const d = state.desde ? new Date(state.desde + "T00:00:00").getTime() : -Infinity;
    const h = state.hasta ? new Date(state.hasta + "T23:59:59.999").getTime() : Infinity;
    return c.ts >= d && c.ts <= h;
  }
  return true;
}
function filasFiltradas() {
  const q = state.busqueda.trim().toLowerCase();
  let filas = state.evaluaciones.filter(c =>
    (state.vacante === "todas" || c.vacante === state.vacante) &&
    (state.rec === "todas" || c.rec === state.rec) &&
    dentroDeFecha(c) &&
    (state.estadoFiltro === "todos" || (state.estadoFiltro === "descartados" ? c.descartado : state.estadoFiltro === "pendientes" ? esPendiente(c) : state.estadoFiltro === "agendadas" ? (!c.descartado && c.estado.startsWith("Agendada")) : !c.descartado)) &&
    (q === "" || c.nombre.toLowerCase().includes(q) || String(c.folio).includes(q))
  );
  const valor = (c) => state.ordenPor === "folio" ? c.folio : state.ordenPor === "fecha" ? c.ts : c.score;
  filas.sort((a, b) => {
    const d = state.ordenDesc ? valor(b) - valor(a) : valor(a) - valor(b);
    return d !== 0 ? d : b.ts - a.ts;   // si empatan, el más reciente primero
  });
  return filas;
}
function paginaActual(filas) {
  const inicio = (state.pagina - 1) * state.porPagina;
  return filas.slice(inicio, inicio + state.porPagina);
}

function fechaLegibleAgenda() {
  const [y, m, d] = state.fecha.split("-").map(Number);
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${d} ${meses[m - 1]} ${y}, ${state.hora}`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ===================== RENDER ===================== */
function render() {
  actualizarEncabezado();

  const root = document.getElementById("view-root");
  document.body.classList.toggle("is-home", !state.loading && !state.error && state.vista === "vacantes");
  if (state.loading) { root.innerHTML = `<p class="muted">Cargando datos de Supabase…</p>`; return; }
  if (state.error) { root.innerHTML = `<p style="color:#a33a2e">No se pudieron cargar los datos: ${esc(state.error)}</p>`; return; }

  if (state.vista === "vacantes") { root.innerHTML = renderVacantes(); bindVacantes(); return; }
  if (state.vista === "lista") { root.innerHTML = renderLista(); bindLista(); return; }
  if (state.vista === "detalle") { root.innerHTML = renderDetalle(); bindDetalle(); return; }
  if (state.vista === "vacante") { root.innerHTML = renderVacante(); bindVacante(); return; }
}

  </div>`;
}
/* Visor para ver la imagen de la vacante en grande */
function abrirVisorImagen(url, alt) {
  if (document.getElementById("visor-imagen")) return;
  const previo = document.activeElement;
  const visor = document.createElement("div");
  visor.id = "visor-imagen";
  visor.className = "dialog-backdrop";
  visor.setAttribute("role", "dialog");
  visor.setAttribute("aria-modal", "true");
  visor.setAttribute("aria-label", alt);
  visor.style.cursor = "zoom-out";
  visor.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;max-width:96vw;cursor:default">
      <img src="${esc(url)}" alt="${esc(alt)}" style="max-width:94vw;max-height:80vh;object-fit:contain;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)">
      <div style="display:flex;gap:10px">
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener" style="background:#EDF2F6">Abrir en una pestaña nueva ↗</a>
        <button type="button" class="btn btn-primary" id="btn-cerrar-visor">Cerrar</button>
      </div></div>`;
  const cerrar = () => { document.removeEventListener("keydown", alTeclado); visor.remove(); if (previo && previo.focus) previo.focus(); };
  const alTeclado = (e) => { if (e.key === "Escape") cerrar(); };
  visor.onclick = (e) => { if (e.target === visor) cerrar(); };
  document.addEventListener("keydown", alTeclado);
  document.body.appendChild(visor);
  document.getElementById("btn-cerrar-visor").onclick = cerrar;
  document.getElementById("btn-cerrar-visor").focus();
}
function mensajeVac(ok, texto) {
  const el = document.getElementById("vac-msg");
  if (el) el.innerHTML = `<span style="display:block;padding:9px 12px;background:${ok ? "#e4efe7" : "#f4e3e0"};color:${ok ? "#20492f" : "#7a2b21"}">${ok ? "✓ " : ""}${esc(texto)}</span>`;
}
function bindVacante() {
  const v = state.vacantes.find(x => x.id === state.vacanteSel);
  document.getElementById("btn-volver-vac2").onclick = () => { state.vista = "vacantes"; render(); };
  const ver = document.getElementById("btn-ver-candidatos");
  if (ver && v) ver.onclick = () => { state.vista = "lista"; state.vacante = v.titulo; state.rec = "todas"; state.busqueda = ""; state.estadoFiltro = "activos"; render(); };
  const ampliar = document.getElementById("btn-ampliar-img");
  if (ampliar && v) ampliar.onclick = () => abrirVisorImagen(v.imagen_url, "Imagen de la vacante " + v.titulo);
  const guardar = document.getElementById("btn-guardar-vac");
  if (!guardar || !v) return;
  guardar.onclick = async () => {
    const lee = (id) => { const t = document.getElementById(id).value.trim(); return t === "" ? null : Number(t); };
    const min = lee("in-edad-min"), max = lee("in-edad-max"), horario = document.getElementById("in-horario").value;
    const invalida = (n) => n !== null && (!Number.isInteger(n) || n < 15 || n > 99);
    if (invalida(min)) return mensajeVac(false, "La edad mínima debe ser un número entre 15 y 99.");
    if (invalida(max)) return mensajeVac(false, "La edad máxima debe ser un número entre 15 y 99.");
    if (min !== null && max !== null && min > max) return mensajeVac(false, "La edad mínima no puede ser mayor que la máxima.");
    guardar.disabled = true; guardar.textContent = "Guardando…";
    try {
      const { data, error } = await supa.rpc("panel_guardar_vacante", { p_vacante_id: v.id, p_edad_minima: min, p_edad_maxima: max, p_horario: horario, p_clave: CONFIG.WEBHOOK_CLAVE });
      if (error) {
        if (error.code === "PGRST202") throw new Error("Faltan las funciones de vacantes en Supabase. Corre el SQL de vacantes.");
        throw new Error(error.message || "No se pudo conectar con la base de datos.");
      }
      if (!data || data.ok !== true) throw new Error((data && data.error) || "No se pudo guardar.");
      state.vacantesDetalle[v.id] = { ...(state.vacantesDetalle[v.id] || {}), id: v.id, edad_minima: data.edad_minima, edad_maxima: data.edad_maxima, horario: data.horario, actualizado_en: data.actualizado_en };
      document.getElementById("in-horario").value = data.horario || "";
      document.getElementById("vac-actualizado").textContent = "Última actualización: " + new Date(data.actualizado_en).toLocaleString("es-MX", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
      mensajeVac(true, "Guardado.");
    } catch (err) {
      mensajeVac(false, err.message);
    }
    guardar.disabled = false; guardar.textContent = "Guardar condiciones";
  };
}

function renderVacantes() {
  const tarjetas = state.vacantes.map(v => {
    const grupo = state.evaluaciones.filter(c => c.vacanteId === v.id && !c.descartado);
    return { v, total: grupo.length,
      avanzar: grupo.filter(c => c.rec === "avanzar").length,
      agendadas: grupo.filter(c => c.estado.startsWith("Agendada")).length,
      mejor: grupo.length ? Math.max(...grupo.map(c => c.score)) : 0 };

  return `
  <div class="home">
    <section class="home-hero">
      <div class="hero-text">
        <span class="hero-eyebrow"><i></i>DRFC · Reclutamiento IA</span>

          ${feat("check", resumen.avanzar, "Para avanzar")}
          ${feat("calendario", resumen.agendadas, resumen.agendadas === 1 ? "Entrevista agendada" : "Entrevistas agendadas")}
          ${feat("reloj", resumen.pendientes, `Sin revisar +${dias} días`, resumen.pendientes ? "alerta" : "")}
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="ring"><div><div class="ring-num">${resumen.activos}</div><div class="ring-label">${resumen.activos === 1 ? "candidato activo" : "candidatos activos"}</div></div></div>
        ${orb("chat", 62, "6%", "14%", "cian", 0)}
        ${orb("doc", 50, "2%", "66%", "", 1.2)}
        ${orb("grafica", 66, "22%", "84%", "azul", .6)}
        ${orb("calendario", 54, "70%", "80%", "", 2)}
        ${orb("check", 58, "74%", "8%", "azul", 1.6)}
        ${orb("usuario", 44, "42%", "-2%", "", 2.6)}
        ${orb("", 12, "18%", "40%", "punto", .4)}
        ${orb("", 10, "88%", "52%", "punto", 1.8)}
        ${orb("", 8, "56%", "94%", "punto", 3)}
      </div>
      <svg class="home-wave" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 60 C 240 110, 480 0, 760 40 S 1240 90, 1440 30 L1440 100 L0 100 Z" fill="#EDF2F6"/></svg>
    </section>

    <div class="home-body">
      <div class="section-head">
        <div><h2>Vacantes disponibles</h2><p class="muted">${state.vacantes.length} ${state.vacantes.length === 1 ? "vacante" : "vacantes"} · ${resumen.activos} ${resumen.activos === 1 ? "candidato evaluado" : "candidatos evaluados"}</p></div>
      </div>
      ${tarjetas.length ? "" : `<div class="vac-vacio">Todavía no hay vacantes registradas.</div>`}
      <div class="vac-grid">

function bindLista() {
  document.getElementById("btn-volver-vac").onclick = () => { state.vista = "vacantes"; render(); };
  document.getElementById("btn-actualizar").onclick = cargarDatos;
  document.getElementById("btn-csv").onclick = exportarCSV;
  document.getElementById("in-buscar").oninput = e => {
    state.busqueda = e.target.value; state.pagina = 1; render();
    const el = document.getElementById("in-buscar"); el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
  };
  document.getElementById("sel-vacante").onchange = e => { state.vacante = e.target.value; state.pagina = 1; render(); };
  document.getElementById("sel-orden-por").onchange = e => { state.ordenPor = e.target.value; state.pagina = 1; render(); };
  document.getElementById("btn-orden").onclick = () => { state.ordenDesc = !state.ordenDesc; render(); };
  document.getElementById("btn-recientes").onclick = () => { state.ordenPor = "fecha"; state.ordenDesc = true; state.pagina = 1; render(); };
  document.getElementById("sel-fecha").onchange = e => { state.fechaPreset = e.target.value; state.pagina = 1; render(); };
  document.getElementById("sel-estado").onchange = e => { state.estadoFiltro = e.target.value; state.pagina = 1; render(); };
  document.querySelectorAll('[data-kpi="pendientes"]').forEach(el => el.onclick = () => { state.estadoFiltro = "pendientes"; state.pagina = 1; render(); });
  const dd = document.getElementById("in-desde"); if (dd) dd.onchange = e => { state.desde = e.target.value; state.pagina = 1; render(); };
  const hh = document.getElementById("in-hasta"); if (hh) hh.onchange = e => { state.hasta = e.target.value; state.pagina = 1; render(); };
  document.querySelectorAll("[data-rec]").forEach(el => el.onclick = () => { state.rec = el.dataset.rec; state.pagina = 1; render(); });
  document.querySelectorAll(".cand-row").forEach(el => el.onclick = () => abrir(Number(el.dataset.folio)));
  const prev = document.getElementById("btn-pag-prev");
  if (prev) prev.onclick = () => { state.pagina--; render(); };
  const next = document.getElementById("btn-pag-next");
  if (next) next.onclick = () => { state.pagina++; render(); };
}

/* ===================== DESGLOSE DE LA CALIFICACIÓN ===================== */
function leerDesglose(d) {
  if (!d) return null;
  try { d = typeof d === "string" ? JSON.parse(d) : d; } catch (e) { return null; }
  return d && Array.isArray(d.criterios) ? d : null;
}
const ESCOLARIDAD = { primaria: "Primaria", secundaria: "Secundaria", preparatoria_trunca: "Preparatoria trunca", preparatoria: "Preparatoria terminada", tecnica: "Carrera técnica", licenciatura: "Licenciatura o más" };
function pts(n) { return String(Math.round(Number(n) * 10) / 10); }
function nivelInfo(n) {
  if (n >= 1) return { texto: "Cumple", marca: "✓", color: "#2f6b46", bg: "#e4efe7", ink: "#20492f" };
  if (n > 0)  return { texto: "Parcial", marca: "◐", color: "#b5891a", bg: "#f6efdc", ink: "#6d5210" };
  return { texto: "No cumple", marca: "✕", color: "#a33a2e", bg: "#f4e3e0", ink: "#7a2b21" };
}
function renderCriterios(c) {
  const d = c.desglose;
  if (!d) return state.sinColDesglose
    ? `<p class="aviso-req" style="margin:0">No se pudo leer el desglose porque falta la columna <code>desglose</code> en Supabase. Corre el SQL de criterios y vacantes.</p>`
    : `<div class="sin-desglose"><span class="fila-ico lila">${ICONO.doc}</span><div><div class="fila-tit">Esta evaluación no tiene desglose</div><div class="fila-sub">Se hizo antes de que el sistema guardara el detalle por criterios, o no se alcanzó a guardar. Los candidatos nuevos sí lo muestran.</div></div></div>`;
  const origen = (x) => x.fuente === "chat" ? "Declarado en el chat" : (c.sinCv ? "Declarado (sin CV)" : "Leído del CV");
  const paso = (x) => {
    const n = nivelInfo(x.nivel);
    const clase = x.nivel >= 1 ? "cumple" : x.nivel > 0 ? "parcial" : "no";
    const detRaw = x.fuente === "chat" ? (ESCOLARIDAD[x.detalle] || x.detalle || "") : "";
    const det = ({ si: "Sí", no: "No" })[detRaw] || detRaw;
    return `<div class="paso ${clase}">
      <span class="paso-ico" style="background:${n.bg};color:${n.ink}">${n.marca}</span>
      <div class="paso-txt"><div class="paso-tit">${esc(x.criterio)}</div><div class="paso-sub">${origen(x)} · peso ${x.peso}${det ? " · " + esc(det) : ""}</div></div>
      <span class="pill" style="background:${n.bg};color:${n.ink}">${n.texto}</span>
      <span class="paso-pts" style="background:${n.bg};color:${n.ink}"><b>${pts(x.puntos)}</b><small>de ${x.peso}</small></span>
    </div>`;
  };
  const base = d.criterios.filter(x => !x.es_plus);
  const extras = d.criterios.filter(x => x.es_plus);
  const umbral = d.umbral ?? 80;
  const leyenda = c.sinCv
    ? "Esta persona no envió CV: todo lo que se muestra lo declaró ella misma y debe confirmarse en la entrevista."
    : "«Declarado en el chat» lo respondió el candidato; «Leído del CV» lo encontró la IA en el documento.";
  return `
    <p class="muted leyenda">${leyenda}</p>
    <div class="linea">${base.map(paso).join("")}</div>
    ${extras.length ? `<p class="grupo">Extras (suman hasta +10)</p><div class="linea">${extras.map(paso).join("")}</div>` : ""}
    <div class="totales">
      <div class="chip"><span>Criterios</span><b>${pts(d.base)}</b><small>de 100</small></div>
      <div class="chip"><span>Extras</span><b>+${pts(d.extras_aplicados ?? 0)}</b><small>(máx. 10)</small></div>
      <div class="chip fuerte"><span>Calificación</span><b>${c.score}</b></div>
      <div class="chip"><span>Umbral para avanzar en esta vacante</span><b>${umbral}</b></div>
    </div>
    ${d.bloquea_avanzar ? `<p class="aviso-req">No puede quedar en «Avanzar» aunque su calificación llegue al umbral: no cumple un requisito indispensable (ver Riesgos).</p>` : ""}`;
}

/* ===================== DESCARTAR Y RESTAURAR (solo cambia lo que ve la reclutadora; no se avisa al candidato) ===================== */
async function cambiarDescarte(accion) {
  if (!state.seleccion || state.descartando) return;
  state.descartando = true; render();
  try {
    const { data, error } = await supa.rpc("panel_descartar", { p_folio: state.seleccion, p_accion: accion, p_clave: CONFIG.WEBHOOK_CLAVE });
    if (error) {
      if (error.code === "PGRST202") throw new Error("Falta crear la función en Supabase. Corre el SQL de descartar y reiniciar.");
      throw new Error(error.message || "No se pudo conectar con la base de datos.");
    }
    if (!data || data.ok !== true) throw new Error((data && data.error) || "No se pudo completar la acción.");
    const c = state.evaluaciones.find(x => x.folio === state.seleccion);
    if (accion === "descartar") {
      state.descartadosLocal[state.seleccion] = Date.now();
      if (c) { c.descartado = true; c.descartadoEn = Date.now(); }
      state.descartar = "resultado";
    } else {
      delete state.descartadosLocal[state.seleccion];
      if (c) { c.descartado = false; c.descartadoEn = 0; }
    }
    actualizarCampana();
  } catch (err) {
    alert((accion === "descartar" ? "No se pudo descartar al candidato: " : "No se pudo restaurar al candidato: ") + err.message);
  }
  state.descartando = false;
  render();
  if (!state.descartar) cargarDatos({ silencioso: true });
}

      <p style="font-size:14px">${esc((state.resultadoAgenda && state.resultadoAgenda.fecha_hora) || fechaLegibleAgenda())}</p>
      ${state.resultadoAgenda && state.resultadoAgenda.aviso_enviado
        ? `<p style="font-size:14px;padding:10px 12px;background:#e4efe7;color:#20492f">✓ El candidato recibió el aviso por WhatsApp.</p>`
        : `<p style="font-size:14px;padding:10px 12px;background:#f6efdc;color:#6d5210">El aviso por WhatsApp no se pudo enviar en este momento. El sistema lo reintentará automáticamente en unos minutos.</p>`}
      <button class="btn btn-primary" id="btn-cerrar-agenda" style="width:100%">Listo</button>
    </div></div>`;
  }
  return `<div class="dialog-backdrop"><div class="blueprint" style="background:var(--color-bg);width:min(520px,100%);padding:24px 26px">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px">
      <div><h2 style="font-size:28px">Agendar entrevista</h2><p class="muted" style="font-size:13px">${esc(c.nombre)} · ${esc(c.vacante)}</p></div>
      <button class="btn btn-ghost" id="btn-cerrar-agenda" style="font-size:18px;padding:0 4px">✕</button>
    </div>
    <div style="margin-bottom:16px"><label class="muted" style="font-size:12px;text-transform:uppercase;display:block;margin-bottom:5px">Folio del candidato</label>
      <input class="input" type="text" value="EV-${c.folio}" disabled style="font-family:ui-monospace,monospace"></div>
    <div style="margin-bottom:18px"><label class="muted" style="font-size:12px;text-transform:uppercase;display:block;margin-bottom:5px">Fecha</label>
      <input class="input" id="in-fecha" type="date" value="${state.fecha}" min="${hoyLocal()}"></div>
    <div style="margin-bottom:6px" class="muted" style="font-size:12px;text-transform:uppercase">Hora · bloques de 30 min</div>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:8px">
      ${HORAS.map(h => `<button class="slot" data-hora="${h}" style="background:${state.hora===h?"var(--color-accent)":"transparent"};color:${state.hora===h?"#fff":"var(--color-text)"};border-color:${state.hora===h?"var(--color-accent)":"var(--color-divider)"}">${h}</button>`).join("")}
    </div>
    <p class="muted" style="font-size:12px;margin-bottom:20px">Ventana de entrevistas: 11:00 AM – 1:30 PM.</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-secondary" id="btn-cancelar-agenda" style="flex:1">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-agenda" style="flex:2" ${!state.hora || state.confirmando ? "disabled" : ""}>${state.confirmando ? "Agendando…" : "Confirmar"}</button>
    </div>
  </div></div>`;
}
function bindDetalle() {
  document.getElementById("btn-volver-lista").onclick = () => { state.vista = "lista"; render(); };
  const cvBtn = document.getElementById("btn-ver-cv");
  if (cvBtn && !cvBtn.disabled) cvBtn.onclick = () => verCV(state.seleccion);
  const agBtn = document.getElementById("btn-agendar");
  if (agBtn) agBtn.onclick = () => { state.agenda = "abierta"; state.hora = ""; render(); };
  const desBtn = document.getElementById("btn-descartar");
  if (desBtn) desBtn.onclick = () => { state.descartar = "confirmar"; render(); };
  const cancelarDes = document.getElementById("btn-cancelar-descarte");
  if (cancelarDes) cancelarDes.onclick = () => { state.descartar = null; render(); };
  const confirmarDes = document.getElementById("btn-confirmar-descarte");
  if (confirmarDes) confirmarDes.onclick = () => cambiarDescarte("descartar");
  const cerrarDes = document.getElementById("btn-cerrar-descarte");
  if (cerrarDes) cerrarDes.onclick = () => { state.descartar = null; render(); cargarDatos({ silencioso: true }); };
  const restBtn = document.getElementById("btn-restaurar");
  if (restBtn) restBtn.onclick = () => cambiarDescarte("restaurar");
  const cerrar = document.getElementById("btn-cerrar-agenda");
  if (cerrar) cerrar.onclick = () => { const confirmada = state.agenda === "confirmada"; state.agenda = null; render(); if (confirmada) cargarDatos({ silencioso: true }); };
  const cancelar = document.getElementById("btn-cancelar-agenda");
  if (cancelar) cancelar.onclick = () => { state.agenda = null; render(); };
  const fechaInput = document.getElementById("in-fecha");
  if (fechaInput) fechaInput.onchange = e => { state.fecha = e.target.value; render(); };
  document.querySelectorAll("[data-hora]").forEach(el => el.onclick = () => { state.hora = el.dataset.hora; render(); });
  const confirmar = document.getElementById("btn-confirmar-agenda");
  if (confirmar) confirmar.onclick = confirmarAgenda;
}

/* ===================== MENÚ LATERAL Y BARRA SUPERIOR (pantallas internas) ===================== */
const NAV = [
  { id: "vacantes", texto: "Vacantes", icono: ICONO.maletin },
  { id: "candidatos", texto: "Candidatos", icono: ICO2.usuarios },
  { id: "avanzar", texto: "Para avanzar", corto: "Avanzar", icono: ICONO.check },
  { id: "entrevistas", texto: "Entrevistas", icono: ICONO.calendario },
  { id: "pendientes", texto: "Pendientes", icono: ICONO.reloj },
  { id: "descartados", texto: "Descartados", icono: ICO2.archivo }
];
function navActual() {
  if (state.vista === "vacantes" || state.vista === "vacante") return "vacantes";
  if (state.estadoFiltro === "pendientes") return "pendientes";
  if (state.estadoFiltro === "descartados") return "descartados";
  if (state.estadoFiltro === "agendadas") return "entrevistas";
  if (state.rec === "avanzar") return "avanzar";
  return "candidatos";
}
function irA(destino) {
  state.agenda = null; state.descartar = null; state.pagina = 1;
  if (destino === "vacantes") { state.vista = "vacantes"; render(); return; }
  state.vista = "lista"; state.vacante = "todas"; state.busqueda = ""; state.fechaPreset = "todo";
  state.rec = destino === "avanzar" ? "avanzar" : "todas";
  state.estadoFiltro = destino === "pendientes" ? "pendientes" : destino === "descartados" ? "descartados" : destino === "entrevistas" ? "agendadas" : "activos";
  render();
}
function actualizarShell() {
  const sb = document.getElementById("sidebar");
  if (!sb || !sb.firstElementChild) return;
  const activos = state.evaluaciones.filter(c => !c.descartado);
  const cuenta = {
    vacantes: state.vacantes.filter(v => v.activa !== false).length,
    candidatos: activos.length,
    avanzar: activos.filter(c => c.rec === "avanzar").length,
    entrevistas: activos.filter(c => c.estado.startsWith("Agendada")).length,
    pendientes: activos.filter(esPendiente).length,
    descartados: state.evaluaciones.length - activos.length
  };
  const actual = navActual();
  sb.querySelectorAll("[data-nav]").forEach(b => { b.classList.toggle("activo", b.dataset.nav === actual); if (b.dataset.nav === actual) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  sb.querySelectorAll("[data-count]").forEach(s => {
    const n = cuenta[s.dataset.count];
    s.style.display = state.loading ? "none" : "";
    s.textContent = n;
    s.classList.toggle("alerta", s.dataset.count === "pendientes" && n > 0);
  });
  const titulos = { vacantes: "Vacantes", vacante: "Detalle de vacante", detalle: "Perfil del candidato" };
  const t = document.getElementById("topbar-title");
  if (t) t.textContent = titulos[state.vista] || (NAV.find(n => n.id === actual) || {}).texto || "Candidatos";
  const g = document.getElementById("buscar-global");
  if (g && document.activeElement !== g) g.value = state.busqueda || "";
}
(function armarMenuLateral() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = `
    <div class="sb-brand"><img class="sb-logo" src="${LOGO_BLANCO}" alt="DRFC Ingeniería S.A. de C.V."><span class="sb-sub">Reclutamiento IA</span></div>
    <nav class="sb-nav" aria-label="Secciones">
      ${NAV.map(n => `<button type="button" class="sb-item" data-nav="${n.id}"><span class="sb-ico">${n.icono}</span><span class="sb-txt"><span class="largo">${n.texto}</span><span class="corto">${n.corto || n.texto}</span></span><span class="sb-count" data-count="${n.id}"></span></button>`).join("")}
      <a class="sb-item" href="${esc(CONFIG.URL_HOJA_VACANTES)}" target="_blank" rel="noopener"><span class="sb-ico">${ICO2.externo}</span><span>Hoja de vacantes</span></a>
    </nav>
    <div class="sb-art" aria-hidden="true">${ARTE_TORRE}</div>`;
  sb.onclick = (e) => { const b = e.target.closest("[data-nav]"); if (b) irA(b.dataset.nav); };
  document.getElementById("brand-logo").src = LOGO_COLOR;
  const gl = document.getElementById("gate-logo"); if (gl) gl.src = LOGO_COLOR;
  const g = document.getElementById("buscar-global");
  g.oninput = () => {
    state.busqueda = g.value; state.pagina = 1; state.vacante = "todas";   // el buscador de arriba busca en todas las vacantes
    if (state.vista !== "lista") { state.vista = "lista"; state.vacante = "todas"; state.rec = "todas"; state.estadoFiltro = "activos"; state.fechaPreset = "todo"; }
    render();
  };
  document.getElementById("btn-buscar-global").onclick = () => g.focus();
})();

/* ===================== ACCESO ===================== */
document.getElementById("gate-btn").onclick = intentarEntrar;
document.getElementById("gate-input").onkeydown = e => { if (e.key === "Enter") intentarEntrar(); };
function intentarEntrar() {
  const val = document.getElementById("gate-input").value;
  if (val === CONFIG.PASSWORD) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    cargarDatos();
    iniciarActualizacionAutomatica();
  } else {
    document.getElementById("gate-error").style.display = "block";
  }
}

/* Sin login: si PEDIR_CONTRASENA está en false, el panel abre directo */
if (!CONFIG.PEDIR_CONTRASENA) {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  cargarDatos();
  iniciarActualizacionAutomatica();
}

/* Campanita de candidatos nuevos */
document.getElementById("btn-campana").onclick = (e) => { e.stopPropagation(); alternarCampana(); };
document.addEventListener("click", (e) => { if (state.campanaAbierta && !e.target.closest("#panel-aviso")) cerrarCampana(); });
</script>
</body>
